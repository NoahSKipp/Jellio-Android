// Classes the Compose compiler may treat as stable: they only hold read-only
// values and are replaced, never changed in place. Lets rows and cards skip
// recomposing when their data hasn't changed. Only add a class here if that
// holds for it.

// Server data (BaseItemDto and friends) and the cached row snapshots
com.jellio.android.data.model.*
com.jellio.android.data.cache.*
com.jellio.android.data.books.*
com.jellio.android.data.offline.*

// Home, detail, books, downloads, audiobook, and player state handed to composables
com.jellio.android.ui.home.HomeSection
com.jellio.android.ui.home.HomeRow
com.jellio.android.ui.home.PosterHomeRow
com.jellio.android.ui.home.ComingSoonHomeRow
com.jellio.android.ui.home.StudioHubsHomeRow
com.jellio.android.ui.home.ShowcaseInfo
com.jellio.android.ui.player.PauseOverlayInfo
com.jellio.android.ui.player.UpNextInfo
com.jellio.android.ui.player.SubtitleTrackUiState
com.jellio.android.ui.player.AudioTrackUiState
com.jellio.android.ui.detail.*
com.jellio.android.ui.books.*
com.jellio.android.ui.downloads.*
com.jellio.android.ui.audiobook.*

// Read-only Kotlin collections, as the app never changes them after building
kotlin.collections.List
kotlin.collections.Map
kotlin.collections.Set
